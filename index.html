cases(){return `<h2>الحالات (${S.cases.length})</h2><p class="sub">مرتبة حسب الأولوية. لا يُصرف دواء قبل المراجعة الطبية والصيدلية والاعتماد.</p><div class="bar2"><input id="qs" type="search" placeholder="ابحث بالكود أو الاسم أو الهاتف" aria-label="بحث" value="${esc(qf.q)}" oninput="qf.q=this.value;g('cl').innerHTML=caseList()"><select aria-label="المرحلة" onchange="qf.st=this.value;g('cl').innerHTML=caseList()"><option value="all">كل المراحل</option>${STAGES.map((s,i)=>`<option value="${i}" ${String(qf.st)===String(i)?"selected":""}>${s}</option>`).join("")}</select></div><div id="cl">${caseList()}</div>`},
inv(){const l=[...S.inv].sort((a,b)=>a.e.localeCompare(b.e));return `<h2>سجل المخزون</h2><p class="sub">مرتب بقاعدة الأقرب انتهاءً أولًا (FEFO). لا تُقبل أدوية مجهولة المصدر أو مرتجعة.</p>
<div class="card" style="margin-bottom:14px"><div class="row"><label>اسم الدواء<input id="i_n"></label><label>التركيز<input id="i_c"></label><label>الكمية<input id="i_q" type="number" min="1"></label><label>تاريخ الانتهاء<input id="i_e" type="date"></label><label>المصدر<select id="i_s"><option>تبرع عيني</option><option>صيدلية شريكة</option><option>شراء بفاتورة</option><option>بنك الشفاء المصري</option></select></label></div><button class="btn" onclick="addInv()">إضافة للمخزون</button></div>
${l.length?`<div class="card tw"><table><tr><th>الدواء</th><th>الكمية</th><th>الانتهاء</th><th>المصدر</th><th>صرف</th></tr>${l.map(i=>{const d=dd(i.e),s=d<0?'<span class="tag t-u">منتهي</span>':d<=60?'<span class="tag t-h">قريب الانتهاء</span>':"";return `<tr><td>${esc(i.n)} <small>${esc(i.c)}</small></td><td>${i.q}</td><td>${i.e} ${s}</td><td>${esc(i.s)}</td><td>${d<0?`<button class="btn alt sm" onclick="del('inv','${i.id}')">إتلاف</button>`:`<input id="o${i.id}" type="number" min="1" value="1" style="width:60px"> <input id="k${i.id}" placeholder="كود الحالة" style="width:100px"> <button class="btn sm" onclick="out('${i.id}')">صرف</button>`}</td></tr>`}).join("")}</table></div>`:empty("المخزون فارغ. أضف أول صنف.")}
${S.log.length?`<h3 style="margin-top:18px">آخر عمليات الصرف</h3><div class="card tw"><table>${[...S.log].sort((a,b)=>((b.d||'')+b.id).localeCompare((a.d||'')+a.id)).slice(0,8).map(x=>`<tr><td>${x.d}</td><td>${esc(x.n)}</td><td>${x.q}</td><td>${esc(x.code)||"—"}</td></tr>`).join("")}</table></div>`:""}`},
don(){const c=CF(),d=[...S.don].sort((a,b)=>((b.d||'')+b.id).localeCompare((a.d||'')+a.id));return `<h2>التبرعات</h2><p class="sub">سجّل كل تبرع يدويًا بعد التحقق منه. تُحتسب في الأرصدة بعد التأكيد فقط.</p>
<div class="card" style="margin-bottom:14px"><div class="row"><label>اسم المتبرع<input id="n_n"></label><label>المبلغ (جنيه)<input id="n_a" type="number" min="0"></label><label>قناة الاستلام<select id="n_m">${c.pay.map(p=>`<option>${esc(p.type)}</option>`).join("")}<option>نقدًا باليد</option></select></label><label>النوع<select id="n_t"><option>تبرع عام</option><option>كفالة مريض</option><option>تبرع عيني</option></select></label><label>كود المريض (للكفالة)<input id="n_c"></label><label>مرجع التحويل أو وصف العين<input id="n_r"></label><label>التاريخ<input id="n_d" type="date" value="${day(0)}"></label><label>الحالة<select id="n_s"><option>مؤكد</option><option>بانتظار التأكيد</option></select></label></div><button class="btn" onclick="addDon()">تسجيل التبرع</button></div>
${d.length?`<div class="card tw"><table><tr><th>التاريخ</th><th>المتبرع</th><th>المبلغ</th><th>القناة</th><th>النوع</th><th>الحالة</th><th></th></tr>${d.map(x=>`<tr><td>${x.d}</td><td>${esc(x.name)}</td><td>${M(x.amt)}</td><td>${esc(x.ch)}</td><td>${esc(x.type)} ${esc(x.code)}<br><small>${esc(x.ref)}</small></td><td><span class="tag ${x.st==="مؤكد"?"t-ok":"t-h"}">${x.st}</span></td><td>${x.st!=="مؤكد"?`<button class="btn sm" onclick="cfm('${x.id}')">تأكيد</button> `:""}<button class="btn alt sm" onclick="del('donations','${x.id}')">حذف</button></td></tr>`).join("")}</table></div>`:empty("لا توجد تبرعات مسجلة بعد.")}`},
exp(){const e=[...S.exp].sort((a,b)=>((b.d||'')+b.id).localeCompare((a.d||'')+a.id));return `<h2>المصروفات</h2><p class="sub">كل جنيه يخرج يُسجَّل بفاتورة ليُطابَق مع التبرعات والمخزون.</p>
<div class="card" style="margin-bottom:14px"><div class="row"><label>التاريخ<input id="e_d" type="date" value="${day(0)}"></label><label>المبلغ (جنيه)<input id="e_a" type="number" min="0"></label><label>البند<select id="e_c"><option>شراء أدوية</option><option>مصروفات تشغيلية</option><option>أخرى</option></select></label><label>المورد أو الصيدلية<input id="e_s"></label><label>رقم الفاتورة<input id="e_i"></label></div><button class="btn" onclick="addExp()">تسجيل المصروف</button></div>
${e.length?`<div class="card tw"><table><tr><th>التاريخ</th><th>المبلغ</th><th>البند</th><th>المورد</th><th>فاتورة</th><th></th></tr>${e.map(x=>`<tr><td>${x.d}</td><td>${M(x.amt)}</td><td>${esc(x.cat)}</td><td>${esc(x.sup)}</td><td>${esc(x.inv)}</td><td><button class="btn alt sm" onclick="del('expenses','${x.id}')">حذف</button></td></tr>`).join("")}</table></div>`:empty("لا توجد مصروفات مسجلة.")}`},
pay(){const c=CF();return `<h2>الدفع والإعدادات</h2><p class="sub">كل ما تسجله هنا يُحفظ في الشيت، وما تعدله في الشيت يدويًا يظهر هنا خلال نحو 30 ثانية.</p>
<div class="card" style="margin-bottom:14px"><div class="row"><label>الوسيلة<select id="p_t">${PT.map(t=>`<option>${t}</option>`).join("")}</select></label><label>الرقم أو رقم الحساب<input id="p_n" dir="ltr"></label><label>اسم صاحب الحساب<input id="p_h"></label><label>ملاحظة<input id="p_o"></label></div><button class="btn" onclick="addPay()">إضافة وسيلة دفع</button></div>
${c.pay.length?`<div class="card tw"><table>${c.pay.map((p,i)=>`<tr><td>${esc(p.type)}</td><td dir="ltr">${esc(p.number)}</td><td>${esc(p.holder)}</td><td>${esc(p.note)}</td><td><button class="btn alt sm" onclick="rmPay(${i})">حذف</button></td></tr>`).join("")}</table></div>`:empty("لم تُضف وسائل دفع بعد.")}
<div class="card" style="margin-top:14px"><div class="row"><label>رقم واتساب لاستقبال الإيصالات (بصيغة دولية: 20100…)<input id="s_w" dir="ltr" value="${esc(c.wa)}"></label><label>هدف التبرعات (جنيه)<input id="s_g" type="number" min="0" value="${c.goal||""}"></label></div><button class="btn" onclick="saveS()">حفظ الإعدادات</button> <a class="btn alt" style="text-decoration:none;display:inline-block" href="https://docs.google.com/spreadsheets/d/${SID}/edit" target="_blank" rel="noopener">فتح الشيت</a></div>
<div class="ban" style="margin-top:14px">وسائل الدفع ورقم واتساب والهدف تظهر لكل زوار الموقع تلقائيًا.</div>`}};
const qf={q:"",st:"all"},sig={};let lastSync=0;
function bz(on){document.body.classList.toggle("busy",!!on);pill()}
function pill(){const p=g("st");if(!p)return;const b=document.body.classList.contains("busy");p.className="pill "+(b?"wait":live?"on":(err||!ok())?"err":"wait");p.textContent=b?"جارٍ الحفظ…":live?"متصل بالشيت"+(lastSync?" · "+new Date(lastSync).toLocaleTimeString("ar-EG",{hour:"2-digit",minute:"2-digit"}):""):!ok()?"غير متصل":err?"خطأ في الاتصال":"جارٍ الاتصال…"}
function ask(m){return new Promise(r=>{const d=document.createElement("div");d.className="mod";d.setAttribute("role","dialog");d.setAttribute("aria-modal","true");d.innerHTML=`<div><p style="margin:0 0 18px;font-weight:600">${esc(m)}</p><button class="btn" id="ay">تأكيد</button> <button class="btn alt" id="an">إلغاء</button></div>`;document.body.appendChild(d);const x=v=>{d.remove();r(v)};d.querySelector("#ay").onclick=()=>x(true);d.querySelector("#an").onclick=()=>x(false);d.onclick=e=>{if(e.target===d)x(false)};d.addEventListener("keydown",e=>{if(e.key==="Escape")x(false)});d.querySelector("#an").focus()})}
function bad(id,m){const e=g(id);if(e){e.classList.add("bad");e.focus();e.addEventListener("input",()=>e.classList.remove("bad"),{once:true})}toast(m,"err")}
function caseList(){const q=qf.q.trim().toLowerCase(),c=S.cases.filter(x=>(qf.st==="all"||x.stage===+qf.st)&&(!q||(x.id+" "+x.head+" "+x.phone).toLowerCase().includes(q)));
 return c.length?[...c].sort((a,b)=>b.score-a.score).map(x=>{const p=prio(x.score),fund=sum(S.don.filter(d=>d.code===x.id&&d.st==="مؤكد"),d=>d.amt);return `<div class="card case"><div class="ch"><b>${esc(x.id)}</b><span class="tag ${p[1]}">${p[0]}</span><span class="tag">${x.score}/100</span><span class="tag">${x.chronic?"مزمن":"مؤقت"}</span>${fund?`<span class="tag t-ok">كفالة ${M(fund)}</span>`:""}<span class="who">${esc(x.head)}${x.phone?" · <span dir='ltr'>"+esc(x.phone)+"</span>":""} · ${x.patients} مريض</span></div>${stepsH(x)}<div class="sub" style="margin:0 0 10px;font-size:14px">العنوان: ${esc(x.addr)||"—"} · الأدوية: ${esc(x.meds)||"—"}</div><label>آخر تعديل طبي (يراه الكفيل)<input value="${esc(x.upd)}" onchange="cu('${x.id}',this.value)"></label><button class="btn sm" onclick="adv('${x.id}')" ${x.stage>=5?"disabled":""}>${x.stage>=5?"مكتملة":"إتمام: "+STAGES[x.stage]}</button> <button class="btn alt sm" onclick="del('cases','${x.id}')">حذف</button></div>`}).join(""):empty(S.cases.length?"لا نتائج مطابقة للبحث.":"لا توجد حالات بعد. سجّل أول حالة من تبويب «تسجيل حالة».")}
async function login(){const v=g("pw").value.trim();if(!v)return bad("pw","اكتب كلمة السر");PW=v;
 try{bz(1);await call({action:"auth"});adm=true;try{sessionStorage.setItem("pw",PW)}catch(e){}lastSig="";await load(1);render(1)}
 catch(e){PW="";toast(errMsg(e),"err")}finally{bz(0)}}
function logout(){adm=false;PW="";lastSig="";S={...S,cases:[],inv:[],don:[],exp:[],log:[]};try{sessionStorage.removeItem("pw")}catch(e){}load(1)}
function cp(t){try{navigator.clipboard.writeText(t);toast("تم النسخ")}catch(e){toast("انسخ الرقم يدويًا")}}
function wa(){const c=CF(),n=+g("da").value;if(!g("dn").value.trim()||!(n>0))return toast("اكتب اسمك والمبلغ");if(!c.wa)return toast("رقم الاستقبال لم يُحدد بعد. تواصل مع الإدارة.");
 const m=`السلام عليكم، قمت بالتبرع لمشروع دوائك علينا.\nالاسم: ${g("dn").value}\nالمبلغ: ${n} جنيه\nالوسيلة: ${g("dm").value}\nالنوع: ${g("dt").value}${g("dc").value?"\nكود المريض: "+g("dc").value:""}\nمرفق إيصال التحويل.`;
 window.open("https://wa.me/"+c.wa.replace(/\D/g,"")+"?text="+encodeURIComponent(m),"_blank")}
async function sp(){const c=g("sp").value.trim().toUpperCase();if(!c)return bad("sp","اكتب كود الحالة");
 try{bz(1);const j=await call({action:"track",code:c});const st=STAGES.indexOf(j.stage);
  g("spo").innerHTML=j.found?`<div class="card"><h3>${esc(c)}</h3>${stepsH({stage:Math.max(0,st)})}<p>الحالة: ${st>=4?"استلم العلاج":"قيد الإجراء"} · ${j.chronic?"علاج مزمن":"احتياج مؤقت"}</p><p><b>آخر تعديل طبي:</b> ${esc(j.upd)||"لا توجد تعديلات"}</p></div>`:'<div class="card warn">الكود غير موجود. تأكد من كتابته كما وصلك، مثل DW-0001.</div>'}
 catch(e){fail(e)}finally{bz(0)}}
const wk=(i,v)=>{const w={...S.weeks,[i]:v};return wr({action:"setcfg",weeks:Object.keys(w).filter(k=>w[k]).map(k=>+k+1).join(",")})};
function fm(){return{members:+g("f_mem").value||1,patients:+g("f_pat").value||1,income:+g("f_inc").value||0,cost:+g("f_cost").value||0,urgency:+g("f_urg").value,chronic:g("f_chr").value==="1",alt:g("f_alt").value==="1"}}
function pv(){if(!g("sc"))return;const f=fm(),s=calc(f),p=prio(s);g("sc").textContent=s+" / 100";g("pr").innerHTML=`<span class="tag ${p[1]}">أولوية ${p[0]}</span>`;g("det").textContent="نصيب الفرد من الدخل: "+Math.round(f.income/f.members)+" جنيه شهريًا"}
async function addCase(){const f=fm(),n0=g("f_head").value.trim();if(!n0)return bad("f_head","اكتب اسم رب الأسرة");
 const o={id:"",head:n0,phone:g("f_ph").value,addr:g("f_ad").value,...f,rx:g("f_rx").value,meds:g("f_meds").value.trim(),notes:g("f_notes").value,stage:g("f_rx").value==="متاح"?1:0,upd:"",d:day(0)};
 const j=await up("cases",o);if(j){toast("تم الحفظ. الكود: "+j.id,"ok");sub="cases";render(1)}}
const adv=id=>{const x=S.cases.find(c=>c.id===id);return x&&pt("cases",id,{15:STAGES[Math.min(5,x.stage+1)]})};
const cu=(id,v)=>pt("cases",id,{16:v});
async function addInv(){const n=g("i_n").value.trim(),q=+g("i_q").value,e=g("i_e").value;if(!n)return bad("i_n","اكتب اسم الدواء");if(q<1)return bad("i_q","اكتب الكمية");if(!e)return bad("i_e","حدد تاريخ الانتهاء");
 if(dd(e)<0)return toast("لا يُقبل صنف منتهي الصلاحية","err");await up("inv",{id:nid(),n,c:g("i_c").value,q,e,s:g("i_s").value})}
async function out(id){const i=S.inv.find(x=>x.id===id),q=+g("o"+id).value,code=g("k"+id).value.trim().toUpperCase();if(!i||q<1||q>i.q)return toast("الكمية غير صحيحة أو أكبر من المتاح","err");
 if(code&&!S.cases.some(c=>c.id===code))return toast("كود الحالة غير موجود","err");
 if(await wr({action:"invOut",id,q,code,d:day(0),n:i.n}))toast("تم تسجيل الصرف","ok")}
async function addDon(){const a=+g("n_a").value,n0=g("n_n").value.trim(),code=g("n_c").value.trim().toUpperCase();if(!n0)return bad("n_n","اكتب اسم المتبرع");if(!(a>0||g("n_t").value==="تبرع عيني"))return bad("n_a","اكتب المبلغ");
 if(code&&!S.cases.some(c=>c.id===code))return toast("كود المريض غير موجود","err");
 if(await up("don",{id:nid(),name:n0,amt:a,ch:g("n_m").value,type:g("n_t").value,code,ref:g("n_r").value,d:g("n_d").value,st:g("n_s").value}))toast("تم تسجيل التبرع","ok")}
const cfm=id=>pt("don",id,{8:"مؤكد"});
async function addExp(){const a=+g("e_a").value;if(!(a>0))return bad("e_a","اكتب مبلغ المصروف");if(await up("exp",{id:nid(),d:g("e_d").value,amt:a,cat:g("e_c").value,sup:g("e_s").value,inv:g("e_i").value}))toast("تم تسجيل المصروف","ok")}
function addPay(){const n=g("p_n").value.trim();if(!n)return bad("p_n","اكتب الرقم أو رقم الحساب");up("pay",{id:nid(),type:g("p_t").value,number:n,holder:g("p_h").value,note:g("p_o").value})}
function rmPay(i){const p=S.pay[i];if(p)del("pay",p.id)}
async function saveS(){if(await wr({action:"setcfg",wa:g("s_w").value.replace(/\D/g,""),goal:+g("s_g").value||0}))toast("تم حفظ الإعدادات","ok")}
init();
</script>
</body>
</html>
